[project]
name = "rag-bootcamp"
version = "0.1.0"
description = "Hands-on RAG tutorial, from basic retrieval to agentic pipelines, with shared helpers in src/"
readme = "README.md"
authors = [
    { name = "mlbala", email = "imbkrishnaa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.3.0",
    "jq>=1.12.0",
    "langchain>=1.4.1",
    "langchain-astradb>=1.0.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-milvus>=0.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.2",
    "matplotlib>=3.11.2",
    "msoffcrypto-tool>=6.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "tiktoken>=0.14.0",
    "unstructured[docx]>=0.27.8",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

# Ship src/ragkit/ as the importable `ragkit` package (module-root defaults to "src"), so
# `from ragkit.config import ...` works from notebooks/, apps/ and scripts once `uv sync`
# installs the project in editable mode. Only src/ goes on sys.path, not the project root.
[tool.uv.build-backend]
module-name = "ragkit"
