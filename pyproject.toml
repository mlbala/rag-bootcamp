[project]
name = "ragkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mlbala", email = "imbkrishnaa@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.3.0",
    "jq>=1.12.0",
    "langchain>=1.4.1",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "msoffcrypto-tool>=6.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "tiktoken>=0.14.0",
    "unstructured[docx]>=0.27.8",
]

[project.scripts]
ragkit = "ragkit:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
